<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Trick-Taking — Replay</title>
<link rel="stylesheet" href="./chrome.css">
</head>
<body>
<div id="layout">
  <div id="stage">
    <div id="topband">
      <div id="wordmark">TRICK<span>·TAKING</span></div>
      <div id="clock">HAND 0</div>
      <div id="topright">
        <span id="statuschip">replay</span>
        <!-- trick-taking additions to the inherited cogame-babel chrome -->
        <div id="modulechip">EUCHRE</div>
        <button id="feedtoggle">LOG »</button>
      </div>
    </div>
    <div id="scorebug"></div>
    <div id="board-wrap">
      <canvas id="table" width="960" height="640"></canvas>
      <div id="lightpool"></div>
      <div id="grain"></div>
      <div id="endscreen"></div>
    </div>
    <div id="transport">
      <div class="scrub" id="scrub"></div>
      <div class="tbar">
        <button class="tbtn" id="play">❚❚</button>
        <span class="tpos" id="pos">0 / 0</span>
      </div>
    </div>
    </div>
  <div id="feed"></div>
</div>
<div id="loading">LOADING REPLAY…</div>
<script src="./renderer.js"></script>
<script src="./trick_taking_replay.js"></script>
<script src="./static_replay.js"></script>
<script>
  var canvas = document.getElementById("table");
  function fit() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  fit();
  TrickTakingRenderer.bindFeedToggle(document.getElementById("feedtoggle"),
    true);
  // attach happens in static_replay.js once the wasm module loads
</script>
<!-- trick-taking additions to the inherited cogame-babel chrome -->
<script>
  // relayout() measures #transport and publishes --band and --hudscale on
  // document.documentElement (:root) -- never on #stage, where a
  // :root-scoped consumer would never see them. The appended CSS block
  // scales the top band, the scorebug and the module chip by --hudscale,
  // which is what makes the 360px featured-match case legible.
  TrickTakingRenderer.relayout();
  window.addEventListener("resize", TrickTakingRenderer.relayout);
  window.addEventListener("load", TrickTakingRenderer.relayout);
</script>
</body>
</html>
