<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Trick-Taking — Table View</title>
<link rel="stylesheet" href="/client/chrome.css">
</head>
<body>
<div id="layout">
  <div id="stage">
    <div id="topband">
      <div id="wordmark">TRICK<span>·TAKING</span></div>
      <div id="clock">HAND 0</div>
      <div id="topright">
        <span id="statuschip">connecting…</span>
        <!-- trick-taking additions to the inherited cogame-babel chrome -->
        <div id="modulechip">EUCHRE</div>
        <button id="feedtoggle">LOG »</button>
      </div>
    </div>
    <div id="scorebug"></div>
    <div id="board-wrap">
      <canvas id="table" width="960" height="640"></canvas>
      <div id="lightpool"></div>
      <div id="grain"></div>
      <div id="endscreen"></div>
    </div>
    </div>
  <div id="feed"></div>
</div>
<script src="/client/renderer.js"></script>
<script>
  var canvas = document.getElementById("table");
  function fit() {
    var parent = canvas.parentElement;
    canvas.width = canvas.clientWidth || (parent && parent.clientWidth) || 960;
    canvas.height = canvas.clientHeight || (parent && parent.clientHeight) ||
      640;
  }
  window.addEventListener("resize", fit);
  window.addEventListener("load", fit);
  fit();
  TrickTakingRenderer.bindFeedToggle(document.getElementById("feedtoggle"));
  TrickTakingRenderer.attachLive({
    canvas: canvas,
    feed: document.getElementById("feed"),
    status: document.getElementById("statuschip"),
    clock: document.getElementById("clock"),
    scorebug: document.getElementById("scorebug"),
    endscreen: document.getElementById("endscreen"),
    modulechip: document.getElementById("modulechip"),
    assetBase: "/client/assets",
    wsPath: "/global"
  });
</script>
<!-- trick-taking additions to the inherited cogame-babel chrome -->
<script>
  TrickTakingRenderer.relayout();
  window.addEventListener("resize", TrickTakingRenderer.relayout);
  window.addEventListener("load", TrickTakingRenderer.relayout);
</script>
</body>
</html>
