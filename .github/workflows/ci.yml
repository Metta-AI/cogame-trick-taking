# CI for a Coworld game repo (Metta-AI/cogame-trick-taking).
#
# Goes to:  .github/workflows/ci.yml  in the coworld repo.
# Substitute: trick-taking  (lowercase game slug, e.g. bullwhip)
#             coworld-trick-taking (local image name WITHOUT a tag, must match the image in
#                      compose.yaml minus ":latest", e.g. coworld-bullwhip)
#             4 (seat count -- a CROSS-CHECK, not a fallback:
#                      docker_smoke.sh takes the seat count solely from
#                      certification.game_config.num_agents and hard-fails if
#                      this value disagrees with it)
#
# The coworld-builder sandbox has no docker, no nim, no emsdk and no browser:
# this workflow is the ONLY place those toolchains run. Phase 20's exit
# criterion is this workflow green on main.
#
# It also needs tools/ci/viewer_smoke.mjs (copied verbatim from coworld-builder
# templates/tools/ci/; no substitutions) -- the wasm-viewer job opens the built
# bundle in headless chromium and fails if the replay never renders.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SLUG: trick-taking
  IMAGE: coworld-trick-taking
  # Pins mirror the Dockerfile build stage; bump both together.
  NIMBY_VERSION: "0.1.26"
  NIM_VERSION: "2.2.4"

jobs:
  # ---------------------------------------------------------------------
  # Native Nim tests. Same nimby recipe as the Dockerfile build stage, so a
  # green test job means the image's compiler and package tree agree.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Cache nimby toolchain and nimcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nimby
            ~/.cache/nim
          key: nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-${{ hashFiles('nimby.lock') }}
          restore-keys: |
            nimby-${{ runner.os }}-${{ env.NIMBY_VERSION }}-${{ env.NIM_VERSION }}-

      - name: Install nimby and Nim
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          arch="$(dpkg --print-architecture)"
          case "$arch" in
            amd64) asset="nimby-Linux-X64" ;;
            arm64) asset="nimby-Linux-ARM64" ;;
            *) echo "::error::unsupported runner arch: $arch"; exit 1 ;;
          esac
          curl -fsSL -o "$HOME/.local/bin/nimby" \
            "https://github.com/treeform/nimby/releases/download/${NIMBY_VERSION}/${asset}"
          chmod +x "$HOME/.local/bin/nimby"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/nimby" use "$NIM_VERSION"

      - name: Sync Nim dependencies
        run: |
          set -euo pipefail
          if [ -f nimby.lock ]; then
            nimby --global sync nimby.lock
          else
            echo "no nimby.lock in the repo; skipping dependency sync"
          fi

      - name: Regenerate nim.cfg from the synced package tree
        # The committed nim.cfg pins the AUTHOR's machine package paths. Rebuild
        # it from this runner's ~/.nimby/pkgs, exactly as the Dockerfile does.
        run: |
          set -euo pipefail
          rm -f nim.cfg
          for pkg in "$HOME"/.nimby/pkgs/*; do
            [ -e "$pkg" ] || continue
            if [ -d "$pkg/src" ]; then
              echo "--path:\"$pkg/src\"" >> nim.cfg
            else
              echo "--path:\"$pkg\"" >> nim.cfg
            fi
          done
          echo '--path:"src"' >> nim.cfg
          echo "::group::nim.cfg"
          cat nim.cfg
          echo "::endgroup::"

      - name: Run tests
        # Every tests/*.nim runs twice: debug (range/overflow checks, stack
        # traces) and -d:release (release-only compile errors and codegen bugs
        # that debug runs never see). Repo variables narrow that:
        #   NIM_TESTS               space-separated test files (default tests/*.nim)
        #   NIM_TESTS_DEBUG_ONLY    files to run ONLY in debug
        #   NIM_TESTS_RELEASE_ONLY  files to run ONLY in release
        env:
          NIM_TESTS: ${{ vars.NIM_TESTS }}
          NIM_TESTS_DEBUG_ONLY: ${{ vars.NIM_TESTS_DEBUG_ONLY }}
          NIM_TESTS_RELEASE_ONLY: ${{ vars.NIM_TESTS_RELEASE_ONLY }}
        run: |
          set -uo pipefail
          tests="${NIM_TESTS:-}"
          if [ -z "${tests}" ]; then
            tests="$(ls tests/*.nim 2>/dev/null | tr '\n' ' ')"
          fi
          if [ -z "$(echo "${tests}" | tr -d ' ')" ]; then
            echo "::error::no test files found (tests/*.nim empty and NIM_TESTS unset)"
            exit 1
          fi
          fail=0
          for t in ${tests}; do
            if [ ! -f "${t}" ]; then
              echo "::error::test file not found: ${t}"
              fail=1
              continue
            fi
            modes="debug release"
            case " ${NIM_TESTS_DEBUG_ONLY} " in *" ${t} "*) modes="debug" ;; esac
            case " ${NIM_TESTS_RELEASE_ONLY} " in *" ${t} "*) modes="release" ;; esac
            for m in ${modes}; do
              if [ "${m}" = "release" ]; then
                flags="--hints:off -d:release"
              else
                flags="--hints:off"
              fi
              echo "::group::nim r ${flags} --path:src ${t}"
              # shellcheck disable=SC2086
              if ! nim r ${flags} --path:src "${t}"; then
                echo "::error::FAILED (${m}) ${t}"
                fail=1
              fi
              echo "::endgroup::"
            done
          done
          exit "${fail}"

      # Acceptance checklist item 7, second clause: the baselines' bidding
      # thresholds are the output of a grid sweep, not guesses. The harness
      # is a gate as well as a record -- it exits non-zero if any grid point
      # beats the shipped configuration by more than the noise band, so a
      # hand-edited threshold turns this step red. docs/tuning.md is the
      # committed output of exactly this command.
      - name: Baseline tuning sweep (grid harness)
        run: |
          set -euo pipefail
          nim r --hints:off -d:release --path:src tools/ci/tune_baselines.nim \
            --matches 96

      # The committed worst-case replay the wasm-viewer job plays in a
      # browser. tests/test_sim.nim regenerates it with this same proc and
      # DIFFS it against the committed bytes, so it can never drift from the
      # format; this step uploads the freshly generated copy so a drift can
      # be inspected (and, on the very first run, committed).
      - name: Regenerate the hearts_moon viewer fixture
        if: always()
        run: |
          set -euo pipefail
          nim r --hints:off --path:src tools/ci/gen_fixture.nim \
            dist/fixture/hearts_moon.replay
          ls -l dist/fixture/

      - name: Upload the hearts_moon fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hearts-moon-fixture
          path: dist/fixture/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------
  # Packaging smoke: the production image builds, and one real episode runs
  # end to end in raw docker with the certification fixture's seat mix.
  # ---------------------------------------------------------------------
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # Invoked by path, not through `bash`: a `bash SCRIPT` call ignores the exec
      # bit, so a 0644 helper would go green here and only fail wherever it is
      # executed directly.
      - name: Assert the smoke script is present and executable
        run: |
          set -euo pipefail
          test -f tools/ci/docker_smoke.sh || {
            echo "::error::tools/ci/docker_smoke.sh is missing"; exit 1; }
          test -x tools/ci/docker_smoke.sh || {
            echo "::error::tools/ci/docker_smoke.sh must be committed executable (mode 100755)."
            echo "::error::Fix with: git update-index --chmod=+x tools/ci/docker_smoke.sh"
            exit 1; }

      - name: Build image
        run: docker build --platform=linux/amd64 -t "${IMAGE}:ci" .

      - name: Raw-Docker episode smoke
        # SMOKE_SLUG is passed explicitly so the workflow's SLUG is the single
        # source for the game/player entrypoint names; the script's own
        # scaffold-substituted default is only a fallback.
        env:
          SMOKE_SLUG: ${{ env.SLUG }}
        run: ./tools/ci/docker_smoke.sh "${IMAGE}:ci"

      # The replay this episode produced is the ONLY replay in CI that is
      # known to be a real, current-format episode of this game. wasm-viewer
      # downloads it and loads it in a browser, so the viewer is tested
      # against the bytes the platform will actually serve rather than a
      # hand-written fixture that can drift.
      - name: Upload the smoke replay
        uses: actions/upload-artifact@v4
        with:
          name: smoke-replay
          path: dist/smoke/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # The static replay viewer. The platform serves THIS bundle from
  # /v2/coworlds/replays/static/<cow_id>/<sha>/index.html, so a bundle that
  # does not build (or is missing its wasm) means every hosted replay hangs.
  # tools/build_replay_viewer.sh falls back to the pinned emscripten/emsdk
  # container (Dockerfile.replay-viewer) because the runner has no emcc.
  # ---------------------------------------------------------------------
  wasm-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The bundle is EXECUTED here, not merely built, and it is executed against
    # the replay docker-smoke just produced -- hence the dependency.
    needs: docker-smoke
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      # `coworld build` (bundle.py) refuses to package a source replay-viewer
      # bundle unless the hook is BOTH a file and os.X_OK:
      #   "Coworld builds with a source replay viewer bundle require an
      #    executable build hook".
      # Running it as `bash tools/build_replay_viewer.sh` would ignore the exec
      # bit entirely, so a mode-0644 hook passed CI and only blew up later, in
      # coworld-release.yml's "Build the Coworld manifest". Assert the bit, then
      # invoke by path so CI exercises exactly what `coworld build` requires.
      - name: Assert the replay-viewer build hook is present and executable
        run: |
          set -euo pipefail
          test -f tools/build_replay_viewer.sh || {
            echo "::error::tools/build_replay_viewer.sh is missing; coworld build needs it"
            echo "::error::to emit the static replay bundle"
            exit 1; }
          test -x tools/build_replay_viewer.sh || {
            echo "::error::tools/build_replay_viewer.sh must be committed executable (mode 100755):"
            echo "::error::coworld build hard-requires os.X_OK on the build hook."
            echo "::error::Fix with: git update-index --chmod=+x tools/build_replay_viewer.sh"
            exit 1; }

      - name: Assert the viewer load test is present
        run: |
          set -euo pipefail
          test -s tools/ci/viewer_smoke.mjs || {
            echo "::error::tools/ci/viewer_smoke.mjs is missing. It is the only gate that"
            echo "::error::EXECUTES the replay viewer; without it a bundle that deadlocks"
            echo "::error::(cogame-lantern, 2026-08-23) ships green. Copy it from"
            echo "::error::coworld-builder templates/tools/ci/viewer_smoke.mjs."
            exit 1; }

      # Cheap static gates on the known silent failures. None of these can
      # be caught by opening the page, and each of them shipped green once.
      - name: Static greps (export-name lockstep, alias shadowing, beat CSS)
        run: |
          set -euo pipefail
          test -x tools/ci/docker_smoke.sh
          test -x tools/build_replay_viewer.sh
          test -s tools/ci/viewer_smoke.mjs
          test -s tools/ci/fixtures/hearts_moon.replay || {
            echo "::error::tools/ci/fixtures/hearts_moon.replay is missing."
            echo "::error::It is the ONLY replay in CI that carries LLM text"
            echo "::error::(notes, a tell) -- the cert fixture is scripted and"
            echo "::error::emits none. Download the hearts-moon-fixture"
            echo "::error::artifact from the test job and commit it."
            exit 1; }
          python3 - <<'PY'
          import json, re, sys

          fail = []

          cfg = open("replay-viewer/config.nims").read()
          shell = open("replay-viewer/static_replay.js").read()

          # The lantern splice: MODULARIZE/EXPORT_NAME and the JS bootstrap
          # that starts the module are a MATCHED PAIR. A mixture throws
          # nothing, logs nothing and hangs on "Loading replay..." forever.
          m = re.search(r"EXPORT_NAME=(\w+)", cfg)
          if not m:
              fail.append("config.nims declares no EXPORT_NAME")
          else:
              name = m.group(1)
              if name != "TrickTakingReplayModule":
                  fail.append(f"unexpected EXPORT_NAME {name}")
              if f"{name}(" not in shell:
                  fail.append(f"static_replay.js never calls the factory {name}()")
          if "MODULARIZE=1" not in cfg:
              fail.append("config.nims does not link with MODULARIZE=1")

          # Every _tt_* export in the link line must be called by the shell,
          # and every _tt_* the shell calls must be exported.
          m = re.search(r"EXPORTED_FUNCTIONS=([^\s]+)", cfg)
          exported = set(x for x in (m.group(1).split(",") if m else [])
                         if x.startswith("_tt_"))
          called = set("_" + x for x in re.findall(r"module\._(tt_\w+)\(", shell))
          if exported != called:
              fail.append(f"_tt_* export list {sorted(exported)} != shell calls {sorted(called)}")
          if not exported:
              fail.append("no _tt_* functions are exported")

          # The tandem shadowing: a game-block function named like a chrome
          # alias gets shadowed by a hoisted `var X = C.X`.
          src = open("client/renderer.js").read()
          funcs = set(re.findall(r"^\s*function\s+([A-Za-z_$][\w$]*)", src, re.M))
          vars_ = set(re.findall(r"^\s*var\s+([A-Za-z_$][\w$]*)\s*=", src, re.M))
          dup = sorted(funcs & vars_)
          if dup:
              fail.append("renderer.js declares these names as BOTH a function "
                          "and a var (hoisting shadows the function): " + ", ".join(dup))
          if "function markBeat" in src:
              fail.append("the beat builder must not be named markBeat")
          if "function buildTrickBeats" not in src:
              fail.append("buildTrickBeats is missing from renderer.js")

          # Every beat kind the builder can emit has a CSS rule.
          m = re.search(r"var BEAT_KINDS = \[([^\]]*)\]", src, re.S)
          if not m:
              fail.append("renderer.js declares no BEAT_KINDS list")
          else:
              kinds = re.findall(r'"([\w-]+)"', m.group(1))
              css = open("client/chrome.css").read()
              for kind in kinds:
                  if f".beat-marker.{kind}" not in css:
                      fail.append(f"beat kind '{kind}' has no rule in chrome.css")
              emitted = set(re.findall(r'kind:\s*"([\w-]+)"', src))
              emitted |= set(re.findall(r'kind:\s*"(\w+)"\s*\+', src))
              for kind in sorted(emitted):
                  if kind not in kinds:
                      fail.append(f"buildTrickBeats emits '{kind}', which is not in BEAT_KINDS")

          # The scorebug must survive the ~360px featured-match iframe.
          css = open("client/chrome.css").read()
          if "flex: 1 1 auto" not in css or "min-width: 3.2em" not in css:
              fail.append(".plate-name needs flex: 1 1 auto; min-width: 3.2em")
          # ...and the plate's decorations come off before the name does.
          m = re.search(r"@media[^{]*max-width:\s*640px[^{]*\{(.*?\n\})", css, re.S)
          if not m or not re.search(r"\.plate-label[^}]*display:\s*none", m.group(1)):
              fail.append("labels must be hidden under 640px "
                          "(@media (max-width: 640px) { .plate-label { display: none } })")
          if "--band" not in src or "--hudscale" not in src:
              fail.append("relayout() must publish --band and --hudscale")
          # The replay viewer is a STATIC bundle, never a pod.
          manifest = json.load(open("coworld_manifest_template.json"))
          if manifest["game"]["replay_viewer"]["bundle"] != "static-replay-viewer":
              fail.append("game.replay_viewer.bundle must be static-replay-viewer")

          if fail:
              for line in fail:
                  print(f"::error::{line}")
              sys.exit(1)
          print("static greps OK")
          PY

      - name: Build the static replay viewer bundle
        run: ./tools/build_replay_viewer.sh "$PWD/dist/static-replay-viewer"

      - name: Assert the bundle is complete
        run: |
          set -euo pipefail
          out="$PWD/dist/static-replay-viewer"
          test -s "${out}/index.html" || {
            echo "::error::${out}/index.html missing or empty"; exit 1; }
          wasm_count="$(find "${out}" -name '*.wasm' -size +1c | wc -l | tr -d ' ')"
          if [ "${wasm_count}" -lt 1 ]; then
            echo "::error::no non-empty .wasm module in ${out}"
            find "${out}" -type f | sed 's/^/  /'
            exit 1
          fi
          echo "bundle OK:"
          find "${out}" -type f -printf '  %p (%s bytes)\n'

      # -----------------------------------------------------------------
      # The load test. Everything above only proves files EXIST. cogame-lantern
      # shipped a viewer whose emscripten link flags (MODULARIZE / EXPORT_NAME)
      # and whose JS bootstrap came from two different starters: the factory was
      # never called, no error was thrown, and softmax.com sat on
      # "Loading replay..." forever with every file present and 200. Only
      # opening the page in a browser sees that.
      #
      # Playwright is pinned to 1.55.0 in BOTH places -- the npm module and the
      # browser download. Bump them together or the browser 404s.
      # -----------------------------------------------------------------
      - name: Download the smoke replay
        uses: actions/download-artifact@v4
        with:
          name: smoke-replay
          path: dist/smoke

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright (pinned 1.55.0)
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Load the bundle in a real browser
        run: |
          set -euo pipefail
          # A for-loop, not `ls … | head -1`: under `set -o pipefail` an unmatched
          # glob makes ls exit 2 and kills the step before the harness ever runs
          # (cogame-raid 2026-08-23, run 32623414696).
          replay=""
          for candidate in dist/smoke/*.replay dist/smoke/replay.json; do
            if [ -f "${candidate}" ]; then replay="${candidate}"; break; fi
          done
          test -n "${replay}" || {
            echo "::error::docker-smoke uploaded no replay to dist/smoke"; ls -la dist/smoke || true; exit 1; }
          echo "loading ${replay} in dist/static-replay-viewer"
          # --strict-text-bounds fails the job if the viewer drew any text
          # outside its canvas -- a bubble, caption or nameplate with nowhere
          # to go, invisible to the load signal and to the screenshot
          # (cogchemists 2026-08-24: four speech bubbles drawn at a negative y
          # and clipped to slivers). Keep it for a FIXED arena, which is every
          # coworld whose whole board fits the frame. DROP THIS FLAG ONLY if
          # the board is pannable, where drawing off-frame is normal -- the
          # count is still reported on stdout and in viewer-smoke.json.
          node tools/ci/viewer_smoke.mjs \
            --bundle dist/static-replay-viewer \
            --replay "${replay}" \
            --timeout 90 \
            --soak 12 \
            --strict-text-bounds

      # The endcard/transport geometry the design note claims viewer_smoke
      # asserts -- it does not, and that file is byte-identical to the
      # coworld-builder template and stays that way. An endcard that covers
      # the scrubber loads, soaks and screenshots exactly like a working one;
      # only measuring the two boxes in a browser sees it.
      - name: The endcard never covers the transport band
        run: |
          set -euo pipefail
          replay=""
          for candidate in dist/smoke/*.replay dist/smoke/replay.json; do
            if [ -f "${candidate}" ]; then replay="${candidate}"; break; fi
          done
          test -n "${replay}" || { echo "::error::no replay in dist/smoke"; exit 1; }
          node tools/ci/chrome_geometry_check.mjs \
            --bundle dist/static-replay-viewer \
            --replay "${replay}"

      # A SECOND invocation against the committed Hearts fixture: a shot
      # moon, a full-cap 400-rune `notes` on every seat, a full-cap 120-rune
      # `tell`, and a non-null audit. The cert fixture is a scripted Euchre
      # episode and a scripted baseline emits NO notes at all, so without
      # this nothing in CI ever draws the LLM-text chrome (cogchemists,
      # 2026-08-24).
      - name: Load the committed hearts_moon fixture in the same bundle
        run: |
          set -euo pipefail
          mkdir -p dist/fixture-smoke
          node tools/ci/viewer_smoke.mjs \
            --bundle dist/static-replay-viewer \
            --replay tools/ci/fixtures/hearts_moon.replay \
            --timeout 90 \
            --soak 12 \
            --strict-text-bounds \
            --out dist/fixture-smoke

      # The renderer fixture: the SHIPPED renderer.js, a synthetic state with
      # a full-cap notes and tell on EVERY seat, at 360x640, 960x640 and
      # 1440x900. 360px is the featured-match iframe width, and it is where
      # a nameplate or a ribbon with nowhere to go shows up.
      - name: Renderer fixture at three canvas sizes
        run: |
          set -euo pipefail
          rm -rf dist/renderer-fixture
          mkdir -p dist/renderer-fixture/assets
          cp tools/ci/renderer_fixture.html dist/renderer-fixture/index.html
          cp client/renderer.js client/chrome.css dist/renderer-fixture/
          cp data/soldier_red_front.png data/soldier_blue_front.png \
            data/soldier_green_front.png data/soldier_yellow_front.png \
            data/arena_floor.png data/font.ttf dist/renderer-fixture/assets/
          echo '{}' > dist/renderer-fixture/unused.replay
          mkdir -p dist/renderer-smoke
          node tools/ci/viewer_smoke.mjs \
            --bundle dist/renderer-fixture \
            --replay dist/renderer-fixture/unused.replay \
            --timeout 60 \
            --strict-text-bounds \
            --out dist/renderer-smoke

      # `--strict-text-bounds` gates never_inside and only REPORTS
      # `ellipsized`, which cannot on its own tell a nameplate's ellipsis
      # (a design choice) from a model's sentence cut mid-word (a defect).
      # This step reads the fixture's own capped strings and fails if any
      # drawn piece of them ends in an ellipsis that is not the string's own
      # tail -- i.e. if the reserved notes band is smaller than the cap the
      # server enforces.
      - name: The notes band fits the server's cap
        run: node tools/ci/notes_fit_check.mjs --fixture dist/renderer-fixture

      - name: Upload the viewer smoke evidence
        # Always: the screenshot and the JSON are most useful when the job is red.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewer-smoke
          path: |
            viewer-smoke.png
            viewer-smoke.json
            dist/fixture-smoke/
            dist/renderer-smoke/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: static-replay-viewer
          path: dist/static-replay-viewer
          if-no-files-found: error
          retention-days: 14
